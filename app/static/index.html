<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROSIT Command Studio</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="grain"></div>
  </div>

  <main class="shell">
    <header class="hero">
      <div class="badge">ROSIT • Миллабот</div>
      <h1>Command Studio</h1>
      <p>Введи команду естественным языком — получи строгий план действий робота.</p>
    </header>

    <section class="grid">
      <div class="panel">
        <div class="panel-header">
          <h2>Команда пользователя</h2>
          <label class="toggle">
            <input type="checkbox" id="strictToggle" />
            <span class="toggle-ui"></span>
            <span class="toggle-text">Только локации из БД</span>
          </label>
        </div>

        <textarea id="inputText" placeholder="Например: Съезди на разгрузку, забери груз и отвези его на выдачу, потом вернись на зарядку"></textarea>

        <div class="actions">
          <button class="primary" id="parseBtn">Сформировать план</button>
          <button class="ghost" id="clearBtn">Очистить</button>
        </div>

        <div class="chips">
          <button data-example="Возьми груз с точки Москва и пойди до точки Париж и выброси его">Москва → Париж</button>
          <button data-example="Съезди на разгрузку, забери груз и отвези его на выдачу, потом вернись на зарядку">Разгрузка → Выдача → Зарядка</button>
          <button data-example="Забери груз из A1 и отвези в B3, затем выгрузи">ID локаций</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>План робота</h2>
          <div class="status" id="status">Ожидание команды</div>
        </div>

        <div class="plan" id="plan"></div>

        <div class="json">
          <div class="json-header">
            <span>JSON ответ</span>
            <button id="copyBtn" class="copy">Скопировать</button>
          </div>
          <pre id="jsonOutput">{}</pre>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
